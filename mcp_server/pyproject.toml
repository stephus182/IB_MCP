[project]
name = "ib-fastmcp-server"
version = "0.1.0"
description = "FastMCP server for Interactive Brokers Web API"
authors = [
    {name = "Ruben Contesti", email = "rcontesti@gmail.com"}
]

requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.8.0,<3.0",
    "fastapi>=0.110.0,<1.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "urllib3>=2.0",
    "mcp>=1.5.0",
    "aiohttp>=3.9",
    "pydantic>=2.7,<2.11",
]

[dependency-groups]
dev = []
